[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-agent"
version = "2.0.0"
description = "Local AI Agent with shared core runtime and a web frontend adapter"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[tool.setuptools.packages.find]
include = ["bff*", "core*"]
