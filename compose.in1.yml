name: local-ai-agent-in1
services:
  runner:
    image: local-ai-agent-skill-runner:latest
    build: ./skills/runner
    ports: ["127.0.0.1:19102:8200"]
    volumes:
      - ./skills/runner:/app:ro
      - ./data/in1/workspace:/workspace
      - in1-packages:/packages
    read_only: true
    tmpfs: [/tmp]
    environment:
      PYTHON_EXEC_TIMEOUT: 120
      SHELL_EXEC_TIMEOUT: 120
    cpus: 2
    mem_limit: 2048m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  files:
    image: local-ai-agent-skill-files:latest
    build: ./skills/files
    ports: ["127.0.0.1:19101:8100"]
    user: "1001:1001"
    volumes:
      - ./skills/files:/app:ro
      - ./data/in1/workspace:/workspace
      - ./data/in1/trash:/trash
      - ./data/in1/logs:/logs
      - ./config:/config:ro
    read_only: true
    tmpfs: [/tmp]
    environment:
      AUTO_GIT_COMMIT: 'true'
      HOME: /tmp
    cpus: 1
    mem_limit: 512m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./config/searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080
    expose: ["8080"]
  skill-websearch:
    image: local-ai-agent-skill-websearch:latest
    build: ./skills/websearch
    ports: ["127.0.0.1:19103:8300"]
    environment:
      SEARXNG_URL: http://searxng:8080
    depends_on:
      - searxng
volumes:
  in1-packages:
