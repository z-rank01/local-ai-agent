name: documents_find
display_name: 查找资料段落
backend: skill-files
tier: extended
cloud: read
description: 资料检索、定位或比较前，优先用它按短语、数字或关键词定位原文件、段落和 PDF 页码，再回读原件核对上下文；不能只凭命中摘要完成阅读。索引不存在或过期时先更新索引，不能把旧内容当最新证据。
parameters:
  type: object
  properties:
    query: {type: string, description: 中文或英文关键词}
    directory: {type: string, description: 限定原资料目录}
    limit: {type: integer, minimum: 1, maximum: 20, default: 5}
  required: [query, directory]
