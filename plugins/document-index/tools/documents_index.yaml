name: documents_index
display_name: 更新资料索引
backend: skill-files
tier: extended
cloud: write
description: 当用户要在一组资料中定位事实、短语、数字或公告时，优先用它建立或更新索引，再查找对应段落。只写当前工作区可重建的索引，不修改原件。按用户限定目录执行，不能用文件名列表或逐个猜测代替索引。
parameters:
  type: object
  properties:
    directory: {type: string, description: 要索引的资料目录}
  required: [directory]
