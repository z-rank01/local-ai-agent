display_name: "提交个股研究"
name: stock_research_submit
backend: stock-bridge
tier: extended
cloud: read
short_description: "提交一个股票研究任务（按代码或股票名称，排队异步执行）。"
description: >
  提交某只 A 股的研究任务，立即返回受理回执（QUEUED），研究由后台异步执行。
  单次调用只研究一只标的：symbol（6 位股票代码，如 600150）或 name（股票名称，如 中国船舶）
  二选一必填，且各自只填一个值——把多只股票塞进一次调用会被拒绝；
  用户一次提到多只股票时，请对每只分别调用一次本工具（可连续多次调用）。
  用户通常只说名称：此时把用户说出的名称原样放进 name，不要自行把名称换算成代码——
  名称到代码的映射由后台可信证券名称表完成，你提供的代码必须来自用户原话。
  名称必须出现在用户本轮消息或本会话已知标的中，否则会被拒绝。
  research_mode：reuse（默认，本会话已有该标的任务则复用，不新建）、
  continue（复用已有研究，没有则报错不新建）、redo（强制新建一个版本）。
  受理不等于完成：你必须明确告诉用户"研究已排队，稍后问进度即可"；不得说成已完成或已读过报告。
  本会话的任务可用 stock_research_find 查询、stock_report_read 读取。
  停止生成不会取消研究；取消研究只能用 stock_research_cancel。
  有具体公开研究问题时必须传 research_question，入队后冻结并传给 C03。
  保留该公开问题原有的指标、报告期间、比较对象、反证及完成判据；可原样传递公开内容，
  不要用通用研究模板替代、遗漏要求或擅自扩大同行范围。只有部分要求可执行时仍传完整公开问题，由报告明确缺口。
  不传账户、持仓或私有文件；复用任务不会改写其冻结问题，问题不一致时会明确拒绝交接。
  research_focus 按用户问题语义选择：event_impact 解释公告经营影响，company 做公司研究，comparison 做指定公司比较。
  event_impact 先查找并读取本会话已保存事件，传 source_reference 和 event_id；公告主体须与研究公司一致。
  comparison 的主公司仍用 name/symbol，其他用户指定公司名称放 comparison_targets；不得擅自遗漏、替换或新增指定对象。
parameters:
  type: object
  properties:
    research_focus:
      type: string
      enum: [event_impact, company, comparison]
      description: "按问题选择公告经营影响、公司研究或指定公司比较；默认company"
    source_reference:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: "事件点评的本会话已保存来源任务引用，来自股票查找工具"
    event_id:
      type: string
      pattern: "^[0-9a-f]{16}$"
      description: "与来源引用绑定、已读取的公告事件编号"
    comparison_targets:
      type: array
      items: {type: string, minLength: 1}
      description: "用户指定的其他股票名称；主公司仍用name/symbol，不自行换算代码"
    symbol:
      type: string
      description: "6 位股票代码，如 600150；与 name 二选一，且必须出现在用户本轮消息中"
    name:
      type: string
      description: "股票名称，如 中国船舶；与 symbol 二选一；用户只说名称时用它，不要自行换算成代码"
    research_mode:
      type: string
      description: "reuse（默认）/ continue / redo"
    research_question:
      type: string
      minLength: 1
      description: "完整公开研究问题，保留用户指定指标、期间、比较对象、反证及完成判据；入队冻结，不能含账户或私有内容"
