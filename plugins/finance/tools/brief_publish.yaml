display_name: 发布研究简报
name: brief_publish
backend: research-runtime
tier: core
cloud: write
description: >-
  发布当前研究的 HTML 简报：正文 markdown、原文引用、计算与图表。推荐先用 file_write 把完整 JSON 写进
  本轮研究目录再只传 draft_path；也可直接传内联字段，draft_path 与内联字段可混用（内联优先）。
  quote 必须是原文连续片段（只允许排版空白差异），发布的数字必须能在该引文里找到；calculations 只需给
  操作与有来源/期间/单位的输入，result 由程序计算。返回已保存文件路径，回复中用该路径的 Markdown 链接展示报告卡。
  比值除法先统一货币单位；0.15倍等于15%，unit为%时结果应写15，不能把比例0.15直接标为0.15%。
  明确单位换算常数须写实际系数单位（如元/亿元、倍/%），不重复自动换算。
  新研究先返回REVIEW_READY和review_ref，本次未发布；读取独立建议后可补查、修改或保留有依据的异议。
  明确发布时再次调用并带review_ref及简短review_response。不要求意见清零。也可先brief_review；
  同稿同证据已有成功回执时复用，不重复调用模型。分析、核对与写作使用同一冻结会话模型。
  调用失败或UNKNOWN时保存未完成草稿，不自动重发，也不标为正式发布。
parameters:
  type: object
  properties:
    stage_updates:
      type: array
      description: 按已返回ID修改阶段，或省略ID新增。可拆分、合并、跳过和重访；保留旧版本，不以阶段完成数量限制研究。
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            description: 修改已有阶段时使用返回ID；新增省略
          name:
            type: string
          goal:
            type: string
          supersedes:
            type: array
            items:
              type: string
            description: 被本阶段替代的阶段ID；旧阶段及版本保留
          depends_on:
            type: array
            items:
              type: string
            description: 其他已登记阶段ID；只是研究依赖，不控制执行权限
          input_refs:
            type: array
            items:
              type: string
            description: 返回artifacts中的实际引用
          expected_outputs:
            type: array
            items:
              type: string
          checks:
            type: array
            items:
              type: string
            description: 如何核查，不是已通过声明
          output_refs:
            type: array
            items:
              type: string
            description: 返回artifacts中的实际产物或回执
          open_questions:
            type: array
            items:
              type: string
          assessment:
            type: string
            description: 模型判断，不构成事实认证
          model_status:
            type: string
            description: 可记录planned/running/partial/done/skipped等判断；不是工具执行状态
          claims:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: 修改使用返回ID；新增省略
                kind:
                  type: string
                  enum:
                  - fact
                  - calculation
                  - inference
                conditions:
                  type: string
                counterevidence:
                  type: string
                unresolved:
                  type: string
                text:
                  type: string
                  description: 正文核心陈述或待核实推断
                entity:
                  type: string
                metric:
                  type: string
                period:
                  type: string
                unit:
                  type: string
                value:
                  type: string
                evidence_refs:
                  type: array
                  items:
                    type: string
              required:
              - text
    active_stage_id:
      type: string
      description: 本次提交选择的阶段ID，不表示执行成功
    review_ref: {type: string, description: 当前稿及证据版本实际返回的核对引用，不可猜测；独立于草稿正文}
    review_response: {type: string, description: 简短说明采纳、补查或保留异议后的发布决定；非隐藏推理，不要求逐条填表}
    draft_path: {type: string, description: 本轮research_begin返回目录内的完整发布JSON；可搭配内联字段覆盖文件同名字段。}
    title: {type: string}
    markdown: {type: string, description: 面向读者的研究正文，不含编制过程或订正清单；来源和计算由程序附在末尾}
    editorial_notes:
      type: array
      items: {type: string}
      description: 可选的编制及修订说明，单独保存为editorial-notes.json；不是独立事实核验，不进入阅读正文
    as_of: {type: string, description: 资料截止日期及未更新范围}
    stance: {type: string, enum: [继续研究, 等待验证, 暂不关注]}
    sources:
      type: array
      items:
        type: object
        properties:
          id: {type: string, description: 实际source_id}
          locator: {type: string, description: 页码或章节位置}
          quote: {type: string, description: 连续原文，允许换行或空白排版差异，不删词或拼接改写}
          excerpt:
            type: object
            description: 可选；从本轮已验证source_excerpts回执复制页码及字符范围，程序补入原句。不能引用仅下载未实际返回的内容；与quote同时给出时须一致。
            properties:
              page: {type: integer}
              start: {type: integer}
              end: {type: integer}
            required: [page, start, end]
        required: [id]
    calculations:
      type: array
      items:
        type: object
        properties:
          operation: {type: string, enum: [sum, subtract, multiply, divide]}
          unit: {type: string, description: 结果数值的实际单位；同类数量比值用倍或%，比值除法按单位归一，0.15倍等于15%；不是把原比值直接加%符号}
          result: {type: string, description: 可省略，由程序以Decimal40位精度计算；显式值必须与算式一致}
          inputs:
            type: array
            items:
              type: object
              properties:
                value: {type: string, description: 原文或常数原值；source引用前项计算时可省略，由程序取值}
                unit: {type: string, description: 原文原值必须填实际单位；仅source为calculation引用时可省略并继承前项单位}
                period: {type: string}
                source: {type: string, description: 实际source_id；前项结果使用calculation:零起始索引；数学常数使用constant:含义且period为不适用}
              required: [period, source]
        required: [operation, inputs, unit]
    charts:
      type: array
      maxItems: 3
      items:
        type: object
        properties:
          title: {type: string}
          unit: {type: string}
          period: {type: string}
          items:
            type: array
            items:
              type: object
              properties:
                label: {type: string}
                value: {type: string, description: 原文原值；引用calculation时可省略，由程序取值}
                source: {type: string, description: 原值来源id，或使用calculation}
                calculation: {type: integer, description: calculations零起始索引}
              required: [label]
        required: [title, unit, period, items]
    visual_limitations: {type: string, description: 可选的图示限制说明，保存于证据而非正文，不替代研究资料限制}
    review:
      type: object
      properties:
        checks: {type: array, items: {type: string}, description: 已实际做的核对，非思维链}
        limitations: {type: string}
        conflicts: {type: array, items: {type: string}}
