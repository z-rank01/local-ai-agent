display_name: 研究阶段
name: research_begin
backend: research-runtime
tier: core
cloud: write
description: >-
  用动态Recipe记录本轮研究目标、阶段产物和检查方式；stage_updates可新增、拆分、合并、跳过和重访阶段。
  程序自动记录真实execution回执，模型用active_stage_id选择关联阶段；判断不等于执行成功，不要求固定阶段全部完成。
  开始或推进当前对话的公开投研：先 phase=准备（scope/targets/plan），再用 evidence_requests 取公告目录、
  公告原件、财报字段、公司概况或带时间行情，最后 phase=核对 并 brief_publish。返回本轮研究目录；
  已登记的 source_id 与保存路径随回执返回，不能猜文件名。公告先 notices 定位 art_code 再 notice 读原件；
  财报用 finance 取目录字段后把选中的正式报告放进 report_articles 读原件，不能只用目录代替财报。
parameters:
  type: object
  properties:
    active_stage_id: {type: string, description: 选择已返回的阶段ID，关联后续真实工具回执；不改变工具权限，不自动认证阶段完成}
    phase:
      type: string
      enum: [准备, 获取, 分析, 核对]
    scope:
      type: string
      description: 研究问题、范围与期限
    targets:
      type: array
      items: {type: string}
    plan:
      type: array
      items: {type: string}
      description: 简短可观察计划，不含隐藏思维链
    recipe:
      type: object
      additionalProperties: false
      description: 初始动态工作单；仅首次使用。目标、产出与检查方式是计划，不预填执行成功。可省略并从plan建立。
      properties:
        stages:
          type: array
          items: &recipe_stage
            type: object
            additionalProperties: false
            properties:
              id: {type: string, description: 修改已有阶段时使用返回ID；新增省略}
              name: {type: string}
              goal: {type: string}
              depends_on: {type: array, items: {type: string}, description: 其他已登记阶段ID；只是研究依赖，不控制执行权限}
              input_refs: {type: array, items: {type: string}, description: 返回artifacts中的实际引用}
              expected_outputs: {type: array, items: {type: string}}
              checks: {type: array, items: {type: string}, description: 如何核查，不是已通过声明}
              output_refs: {type: array, items: {type: string}, description: 返回artifacts中的实际产物或回执}
              open_questions: {type: array, items: {type: string}}
              assessment: {type: string, description: 模型判断，不构成事实认证}
              model_status: {type: string, description: 可记录planned/running/partial/done/skipped等判断；不是工具执行状态}
              claims:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    text: {type: string, description: 正文核心陈述或待核实推断}
                    entity: {type: string}
                    metric: {type: string}
                    period: {type: string}
                    unit: {type: string}
                    value: {type: string}
                    evidence_refs: {type: array, items: {type: string}}
                  required: [text]
      required: [stages]
    stage_updates:
      type: array
      description: 按已返回ID修改阶段，或省略ID新增。可拆分、合并、跳过和重访；保留旧版本，不以阶段完成数量限制研究。
      items: *recipe_stage
    revision_of:
      type: string
      description: 仅首次准备阶段可用。核验原稿、来源及固定方法版本后创建关联研究，交接父稿和历史意见作为待核实材料；不恢复旧任务、不继承核对资格或UNKNOWN。后续发布使用新目录草稿。
    evidence_requests:
      type: array
      description: notices/finance/profile/quote必须给symbol，notice必须给实际article。相同参数不重复执行；目录仍需按标题/主体/期间选公告，不能当全文已读。
      items:
        type: object
        properties:
          kind: {type: string, enum: [notices, notice, finance, profile, quote]}
          symbol: {type: string, description: 已核实的交易所加代码，例如SH688178}
          start: {type: string, description: 公告目录起始日期YYYY-MM-DD}
          end: {type: string, description: 公告目录结束日期YYYY-MM-DD}
          article: {type: string, description: 目录实际返回的AN编号，notice使用}
          page: {type: integer, minimum: 1}
          purpose: {type: string, description: 本项资料支持或反驳什么判断}
          where: {type: object, additionalProperties: {type: string}, description: finance可选，按实际字段精确筛选证券和报告期}
          fields: {type: array, items: {type: string}, description: finance可选，已观察到的原字段名；不猜单位}
          report_articles: {type: array, items: {type: string}, description: finance可选，从实际目录选择的正式报告/更正AN编号，程序沿原工具读取详情及唯一附件，不猜版本}
          terms: {type: array, items: {type: string}, description: 已选报告要实际读取的章节或原文词，例如主营业务、应付股利；返回真实页码摘录及匹配页目录，不等于全文已读}
        required: [kind]
    evidence_notes:
      type: array
      description: 对本轮实际来源的模型标注；不是程序认证，可记录版本冲突及其影响
      items:
        type: object
        properties:
          source_id: {type: string}
          document_kind: {type: string, enum: [公告, 正式定期报告, 业绩快报, 业绩预告, 更正, 第三方字段, 媒体]}
          disclosed_at: {type: string}
          period: {type: string}
          note: {type: string}
        required: [source_id, document_kind]
  required: [phase]
