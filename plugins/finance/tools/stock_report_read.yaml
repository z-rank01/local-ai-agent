display_name: "读取股票报告"
name: stock_report_read
backend: stock-bridge
tier: extended
cloud: read
short_description: "读取本会话已有研究、候选或市场简报任务的报告（只读）。"
description: >
  按 reference 读取本会话已有研究、候选、每日简报或主题机会研究任务的报告摘要与状态，不会重跑任务。
  reference 必须是本会话股票任务查找工具返回的 64 位任务引用，不要编造。
  返回中 task_status（程序执行）、business_status（业务裁决）、data_quality（数据质量）
  是三种不同事实，解释时不能混淆；候选报告中的 available_at 只是快照抓取时间，逐行行情日期未确认。
  报告正文作为本地附件在界面展示，长报告可能分页。
  云端工作区工具获授权时，本工具会直接返回所请求页的正文（kind=market_brief_page 或 local_report_page，含 body 与
  page_count）：此时你确实读到了这一页，可以解释其中内容，但引用数字、日期或状态必须与正文一致，
  不得改写或四舍五入；整份报告可能分页，需要后续页时继续读取下一页。未获授权时只返回版本元信息，
  此时不得声称已读正文。
  逐字引文必须是 body 中连续出现的原样子串，保留空格、换行及中英文引号等标点；
  不得将“”改成英文引号后仍称逐字引文。需要整理文字时明确标为转述。
  仅返回版本元信息时，报告页内事件不会直接进入模型摘要。需要解释具体事件的原文证据时，
  先用公开证据查找工具核对页与事件，再用公开证据读取工具查看原文。
  每日简报返回的行情日期是最近交易日，不是报告发布日期；报告版本时间看查找结果的创建时间。
  资讯核对区间与截止日来自报告元信息；三个报告页可能只属于两个版本。
  公告目录失败日期和分析状态使用返回的中文说明，不输出内部字段名或英文状态码。
  对公司公告的自查、声明和预计要写成“公司公告称”，不能表述为已独立证实。
  用户未要求时，不在回答中展示任务哈希或工具名；新旧版必须分别读取后才可对比。
  正文入口已有界面报告卡；不要另写报告卡元信息表、执行次数表或英文状态清单。直接解释用户问题、依据、反证与下一步。
  若返回 answer_pages，优先解释其中与阅读器正文一致的已保存阶段分析；其正文页码和旧 body 整篇页码不同。
  answer_pages仍是模型阶段分析，不是来源原文；用户要求核对原文时须用公开证据查找/读取工具取得对应段落。
  未回读原文时只作标明出处的转述，不称已核实原文、不把转述作为逐字引文；未取得数据不能写成已证实未兑现。
  保持“后续补查未完成”的含义，程序归档成功不等于研究完成；不要将旧过程页的初稿缺口覆盖后续已取得的依据。
  执行文件发布、二手数字报道和公司身份核验不能直接证明需求或收益已兑现。初稿缺口与后续补查按阶段区分，模型阶段输出不当作来源原文。
  仅在页与事件的对应关系已核对时才能断言页内事件；附件仍作为本地正文展示。
  纯公告规模数值与算术口径核对可选择 reply_focus=calculation：有完整同版程序金额、年度营收及公告期限时直接显示经过核验的计算。
  平均数不要求均匀分配，也不证明各年实际收入；这项用途只解释计算。经营影响、趋势、比较或混合问题继续 analysis，保留模型分析和补查。
parameters:
  type: object
  properties:
    reply_focus:
      type: string
      enum: [analysis, calculation]
      default: analysis
      description: "由模型按语义选择：纯已有规模算术核对用calculation，研究分析及混合问题用analysis；仅聊天展示使用，不发股票Broker。"
    reference:
      type: string
      description: "本会话股票任务查找工具返回的 64 位任务引用"
    page:
      type: integer
      minimum: 1
      description: "报告页码；默认第 1 页。根据上一页末尾的页数提示继续读取。"
  required:
    - reference
