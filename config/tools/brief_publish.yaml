display_name: 发布研究简报
name: brief_publish
backend: research-runtime
tier: core
cloud: write
description: >-
  核对后发布当前研究的HTML简报。先research_begin、实际读方法和新原文，再进入核对阶段。
  原文引句必须来自web_fetch返回的source_id及实际已读内容；只允许排版空白差异，不能删词、拼接或改写条件。正文直接回答问题，解释术语，长段拆分，含理由、反证和最多3项观察条件。
  markdown只写给读者的研究内容，不写修订轮次、删改清单、提示词执行情况或开发验收记录；需要留存时放editorial_notes，程序另存编制记录，不放入简报正文或参考来源。影响判断的事实更正与资料限制仍须在研究内容中说明。
  calculations只需提交操作及有来源/期间/单位的输入，result由程序计算，不必抄写长小数。图表原值须出现在原文引句；引用calculation零起始索引时可省略value，由程序填入。
  单位换算和多步计算须逐步列式：前项结果的source填calculation:零起始索引，value可省略，unit须一致。显式提供的结果或图值若冲突仍拒绝。不能把换算值或中间结果当成原文原值。
  charts.unit仅填真实量纲（如元、万元、%）；同比等说明放title或period，不把“%（同比）”当单位。
  推荐先用容器脚本在本轮研究目录写完整发布JSON，再仅传draft_path。也兼容直接传完整参数。
  核对失败会返回已保存的draft_path和具体错误；复制为工作草稿后定向修改再提交路径，不反复重传全文。不能将失败草稿当成报告卡。
  仅返回已保存文件。最后用返回path的Markdown链接交付报告卡。检查不认证研究判断。
parameters:
  type: object
  properties:
    draft_path: {type: string, description: 本轮research_begin返回目录内的完整发布JSON。使用此项时不要再传其他字段；文件包含下列正文、引用、计算、图表与核对项。}
    title: {type: string}
    markdown: {type: string, description: 面向读者的研究正文，不含编制过程或订正清单；来源和计算由程序附在末尾}
    editorial_notes:
      type: array
      items: {type: string}
      description: 可选的编制及修订说明，单独保存为editorial-notes.json；不是独立事实核验，不进入阅读正文
    as_of: {type: string, description: 资料截止日期及未更新范围}
    stance: {type: string, enum: [继续研究, 等待验证, 暂不关注]}
    sources:
      type: array
      items:
        type: object
        properties:
          id: {type: string, description: 实际source_id}
          locator: {type: string, description: 页码或章节位置}
          quote: {type: string, description: 连续原文，允许换行或空白排版差异，不删词或拼接改写}
        required: [id, locator, quote]
    calculations:
      type: array
      items:
        type: object
        properties:
          operation: {type: string, enum: [sum, subtract, multiply, divide]}
          unit: {type: string}
          result: {type: string, description: 可省略，由程序以Decimal40位精度计算；显式值必须与算式一致}
          inputs:
            type: array
            items:
              type: object
              properties:
                value: {type: string, description: 原文或常数原值；source引用前项计算时可省略，由程序取值}
                unit: {type: string}
                period: {type: string}
                source: {type: string, description: 实际source_id；前项结果使用calculation:零起始索引；数学常数使用constant:含义且period为不适用}
              required: [unit, period, source]
        required: [operation, inputs, unit]
    charts:
      type: array
      maxItems: 3
      items:
        type: object
        properties:
          title: {type: string}
          unit: {type: string}
          period: {type: string}
          items:
            type: array
            items:
              type: object
              properties:
                label: {type: string}
                value: {type: string, description: 原文原值；引用calculation时可省略，由程序取值}
                source: {type: string, description: 原值来源id，或使用calculation}
                calculation: {type: integer, description: calculations零起始索引}
              required: [label]
        required: [title, unit, period, items]
    review:
      type: object
      properties:
        checks: {type: array, items: {type: string}, description: 已实际做的核对，非思维链}
        limitations: {type: string}
        conflicts: {type: array, items: {type: string}}
      required: [checks, limitations, conflicts]
