name: stock_report_read
backend: stock-bridge
tier: extended
cloud: read
short_description: "读取本会话已有研究、候选或市场简报任务的报告（只读）。"
description: >
  按 reference 读取本会话已有研究、候选、每日简报或主题机会研究任务的报告摘要与状态，不会重跑任务。
  reference 必须是本会话股票任务查找工具返回的 64 位任务引用，不要编造。
  返回中 task_status（程序执行）、business_status（业务裁决）、data_quality（数据质量）
  是三种不同事实，解释时不能混淆；候选报告中的 available_at 只是快照抓取时间，逐行行情日期未确认。
  报告正文作为本地附件在界面展示，长报告可能分页。
  云端工作区工具获授权时，本工具会直接返回所请求页的正文（kind=market_brief_page，含 body 与
  page_count）：此时你确实读到了这一页，可以解释其中内容，但引用数字、日期或状态必须与正文一致，
  不得改写或四舍五入；整份报告可能分页，需要后续页时继续读取下一页。未获授权时只返回版本元信息，
  此时不得声称已读正文。
  每日市场简报读取只给版本元信息；报告页内事件不会直接进入模型摘要。需要解释整份简报、
  后续页或具体事件时，先用公开证据查找工具核对页与事件，再用公开证据读取工具查看原文。
  每日简报返回的行情日期是最近交易日，不是报告发布日期；报告版本时间看查找结果的创建时间。
  资讯核对区间与截止日来自报告元信息；三个报告页可能只属于两个版本。
  公告目录失败日期和分析状态使用返回的中文说明，不输出内部字段名或英文状态码。
  对公司公告的自查、声明和预计要写成“公司公告称”，不能表述为已独立证实。
  用户未要求时，不在回答中展示任务哈希或工具名；新旧版必须分别读取后才可对比。
  仅在页与事件的对应关系已核对时才能断言页内事件；附件仍作为本地正文展示。内容不构成投资建议。
parameters:
  type: object
  properties:
    reference:
      type: string
      description: "本会话股票任务查找工具返回的 64 位任务引用"
    page:
      type: integer
      minimum: 1
      description: "报告页码；默认第 1 页。根据上一页末尾的页数提示继续读取。"
  required:
    - reference
