name: file_read
backend: skill-files
tier: core
short_description: "Read a file."
description: >-
  读取工作区内文件的内容，Excel 与 PDF 会自动转成文本。
  文件超过返回上限时分页交付：返回里带 total_chars 与 next_offset，
  把 next_offset 作为下一次调用的 offset 继续读，直到 next_offset 为 null。
  大文件务必分页读完再下结论，不要只看首页就总结全文。
parameters:
  type: object
  properties:
    path:
      type: string
      description: "Absolute path starting with /workspace"
    offset:
      type: integer
      description: "从第几个字符开始读，默认 0；续读时传上一次返回的 next_offset"
    max_chars:
      type: integer
      description: "本次最多返回多少字符；默认与最大均为服务端上限"
  required: ["path"]
max_result_chars: 200000
