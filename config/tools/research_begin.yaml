display_name: 研究阶段
name: research_begin
backend: research-runtime
tier: core
cloud: write
description: >-
  开始当前对话的公开投研并保存范围、标的和计划。首次phase=准备；随后用同一工具报告获取、分析、核对阶段。
  跟随本轮聊天模型，不调用专业任务、不因十分钟强制结束。返回当前工作区的产物目录。
  开始后读取 harness-stock-research-v1 方法，使用实际搜索/原文/计算工具，最后 brief_publish。
parameters:
  type: object
  properties:
    phase:
      type: string
      enum: [准备, 获取, 分析, 核对]
    scope:
      type: string
      description: 研究问题、范围与期限
    targets:
      type: array
      items: {type: string}
    plan:
      type: array
      items: {type: string}
      description: 简短可观察计划，不含隐藏思维链
  required: [phase]
