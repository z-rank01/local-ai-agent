name: stock_research_submit
backend: stock-bridge
tier: extended
short_description: "提交一个股票研究任务（按代码或股票名称，排队异步执行）。"
description: >
  提交某只 A 股的研究任务，立即返回受理回执（QUEUED），研究由后台异步执行。
  单次调用只研究一只标的：symbol（6 位股票代码，如 600150）或 name（股票名称，如 中国船舶）
  二选一必填，且各自只填一个值——把多只股票塞进一次调用会被拒绝；
  用户一次提到多只股票时，请对每只分别调用一次本工具（可连续多次调用）。
  用户通常只说名称：此时把用户说出的名称原样放进 name，不要自行把名称换算成代码——
  名称到代码的映射由后台可信证券名称表完成，你提供的代码必须来自用户原话。
  名称必须出现在用户本轮消息或本会话已知标的中，否则会被拒绝。
  research_mode：reuse（默认，本会话已有该标的任务则复用，不新建）、
  continue（复用已有研究，没有则报错不新建）、redo（强制新建一个版本）。
  受理不等于完成：你必须明确告诉用户"研究已排队，稍后问进度即可"；不得说成已完成或已读过报告。
  本会话的任务可用 stock_research_find 查询、stock_report_read 读取。
  停止生成不会取消研究；取消研究只能用 stock_research_cancel。
parameters:
  type: object
  properties:
    symbol:
      type: string
      description: "6 位股票代码，如 600150；与 name 二选一，且必须出现在用户本轮消息中"
    name:
      type: string
      description: "股票名称，如 中国船舶；与 symbol 二选一；用户只说名称时用它，不要自行换算成代码"
    research_mode:
      type: string
      description: "reuse（默认）/ continue / redo"
