display_name: "查找公开事件证据"
name: stock_public_evidence_find
backend: stock-bridge
tier: extended
cloud: read
short_description: "查找每日简报或公司研究中的公开证据。"
description: >
  已读取报告时，优先使用该报告返回的 source_reference；不得把旧简报引用与新研究的事件混用。
  先用 stock_market_brief_find、stock_theme_research_find 或 stock_research_find 获取本会话已完成简报或主题公司研究的 reference。
  再按标题、公司代码、原文词语或报告页查找公开事件。结果覆盖整份已分析简报，
  简报中空白分隔的多个词在同一事件的标题及原文中全部匹配，允许分布在不同段落。
  已冻结对象的公司研究在检索词包含明确公司名称或代码时，按同一主体、同一条来源片段匹配；
  不指定主体的探索检索保留原范围。可用“公司名称或代码 指标名 YYYYMMDD”定位结构化字段，
  不会把主公司的指标和同行的证券身份拼在一起。结果中的 matched_subject_name/symbol 标明实际命中主体，
  聚合目录的顶层 symbol 仍可能是主公司；读取位置以 read_cursor 为准，不能由顶层代码推断每条字段都属于主公司。
  旧游标维持旧匹配规则；未分词的短句保持连续匹配。
  这不是语义搜索；不要拼造原文没有的组合标题。未命中可改用短词，或省略 search 列出本任务全部已保存来源目录，
  用真实标题选择事件后读取。来源目录不代表原文已读，目录 next_cursor 只能继续 find。
  命中只定位资料，具体数字与条款仍须读取相应原文，不能从标题直接确认。
  公司研究包含已保存的结构化财报字段，文本以“期间 YYYYMMDD”标记报告期；
  查年度指标可用年份的1231期间与指标名，半年指标用0630期间与指标名，具体时期由当前问题决定。
  “年度报告”字样也可能只是其他报告引用年报，不能证明已找到该年度的财务数字。
  找不到指定期间或单位时说明缺口，不擅自改用半年年化、TTM或其他分母替代用户要求的比较。
  每次返回一页，next_cursor 非空时继续查找；命中项带 read_cursor 时，可直接作为首次 stock_public_evidence_read 的 cursor 定位匹配字段。页内事件只能在 page_mapping 为
  CONFIRMED 时断言；UNCONFIRMED 时要说明页码无法核对。
  unread_count 是原目录中未深读的候选数，不是此会话未读数；
  missing_count 是分析缺口条目数，不等于失败公告篇数。
  failed_dates 是公告采集失败的日历日期，可能为休市日，不得称作交易日。
  失败日期和缺口保留。完整 F01 仍只在本地附件展示。
parameters:
  type: object
  properties:
    reference:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: "当前已读报告的 source_reference，或本会话任务查找返回的对应任务引用；勿混用不同报告"
    search:
      type: string
      maxLength: 80
      description: "可选：标题、代码或原文词语；多词全部匹配。省略或空字符串列出当前任务来源目录；未命中可缩短词语或列目录"
    report_page:
      type: integer
      minimum: 1
      description: "可选：只找已核对映射到这一报告页的事件"
    cursor:
      type: string
      description: "仅本查找工具在相同 reference、search、report_page 下返回的 next_cursor；首次或改变查询应省略。不得传读取工具的 next_cursor 或条目 read_cursor"
  required: [reference]
