name: stock_theme_research_submit
backend: stock-bridge
tier: extended
cloud: read
short_description: "从已完成市场简报启动主题、产业链与公司关联研究。"
description: >
  只有用户明确要求研究趋势、产业链、机会或公司关联时调用。
  先用 stock_market_brief_find 取得本会话已完成简报 reference；可选用
  stock_public_evidence_find 的 event_id 作为公司公告起点。
  C01/C02 研究全部已核对的公开事件，生成独立版本；不会自动进入候选、买入或账户操作。
parameters:
  type: object
  properties:
    reference:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: "已完成市场简报的本会话安全引用"
    event_id:
      type: string
      pattern: "^[0-9a-f]{16}$"
      description: "可选：已核对的公司事件编号，作为研究起点"
  required: [reference]
