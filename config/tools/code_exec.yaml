display_name: "运行 Python 代码"
name: code_exec
backend: skill-runner
tier: core
cloud: write
short_description: "Run Python code."
description: "Execute a short Python snippet inside the sandboxed runner. Use this for computation, parsing, and temporary verification."
parameters:
  type: object
  properties:
    code:
      type: string
      description: "Python source code to execute"
    cwd:
      type: string
      description: "工作区内的执行目录；省略时使用当前工作区主要目录"
    timeout:
      type: integer
      description: "Timeout in seconds, up to policy limit"
  required: ["code"]
max_result_chars: 32000
