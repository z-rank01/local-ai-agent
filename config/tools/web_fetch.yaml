display_name: "读取网页"
name: web_fetch
backend: skill-websearch
tier: extended
cloud: read
short_description: "读取网页或PDF并登记source_id/saved_source；附件document_links只是线索，须继续读取；分页按next_offset和source_hash续读。财务接口也须先登记来源。"
description: >
  获取指定网页的正文内容。用于在 web_search 搜索到结果后，深入阅读某个页面的详细内容。
  会自动提取网页或PDF原文，PDF保留页码。next_offset非空时可续读，传回sha256作为source_hash以拒绝快照混合。
  网页或JSON/JSONP接口如含实际PDF附件地址会返回document_links（原地址、链接文字或字段位置、所属页面）；
  可据此继续读原文，不把链接本身当已读。财务接口也须由本工具取得并登记，再用容器处理saved_source，
  避免仅在临时代码中下载而无法随简报引用。
parameters:
  type: object
  properties:
    url:
      type: string
      description: "要获取的网页URL，必须以 http:// 或 https:// 开头"
    max_chars:
      type: integer
      description: "最大返回字符数（默认20000，最大50000）"
    offset:
      type: integer
      description: "续读使用实际next_offset，首次为0"
    source_hash:
      type: string
      description: "续读传上次sha256；来源变化时明确报错"
  required:
    - url
max_result_chars: 50000
