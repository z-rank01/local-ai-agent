display_name: "更新技能"
name: skill_update
backend: skill-runner
tier: extended
cloud: write
short_description: "Update a skill."
description: |
  更新已注册技能的代码或元数据。仅兼容旧式 Python 技能。可更新脚本代码、重新验证格式，不安装依赖；新建技能使用标准目录。
parameters:
  type: object
  properties:
    skill_name:
      type: string
      description: "技能名（不含 .py 后缀）"
    code:
      type: string
      description: "可选：新的技能代码。若提供则覆盖 /workspace/skills/{skill_name}.py"
  required:
    - skill_name
