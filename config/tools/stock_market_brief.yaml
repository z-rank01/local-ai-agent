name: stock_market_brief
backend: stock-bridge
tier: extended
short_description: "获取空仓也可用的每日市场简报任务。"
description: >
  请求最近交易日的市场简报；默认复用当日任务。只有用户本轮明确要求刷新或重试时设 refresh=true。
  空仓、休市日也可用：行情取最近交易日，资讯核对截至今天的公告目录、证监会和发改委列表，分别报告日期与缺口。
  返回任务受理或已有任务状态；尚未完成时用 stock_market_brief_find 查询，
  再用 stock_report_read 读取完整本地报告。刷新会生成新版本，旧报告仍可查；简报不是公司推荐或交易指令。
parameters:
  type: object
  properties:
    refresh:
      type: boolean
      description: "仅在用户本轮明确要求刷新或失败重试时设为 true；默认复用今日版本"
