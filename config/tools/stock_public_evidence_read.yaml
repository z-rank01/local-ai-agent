display_name: "读取事件原文与分析"
name: stock_public_evidence_read
backend: stock-bridge
tier: extended
cloud: read
short_description: "按事件读取可追溯的公开原文和分析。"
description: >
  reference 使用对应查找结果的 source_reference，与 event_id 和游标保持同一任务；不要换成原始简报引用。
  event_id 必须来自 stock_public_evidence_find。读取本事件的来源、日期、
  事实引文、分析、反证、观察事项和有位置的原文段落。长正文用 next_cursor 续取。
  kind 为 ORIGINAL_TEXT 或 PEER_ORIGINAL_TEXT（旧事件未标 kind 时沿用原文）的 excerpt.text，才可加引号称为逐字引文；SOURCE_FIELD 是结构化财报字段，CONDITIONAL_CALCULATION 是条件计算，AI_COMPARABILITY_INFERENCE 是推断，必须区分。
  不得删词、拼接或规范化 PDF 空格后仍称逐字引文。摘短句时也须保持原样，
  优先摘取 10 到 30 字、无需改动引号或空格的连续子串，并在输出前逐字符核对；
  无法保证时只作明确标注的转述。给出对应 excerpt_id 与 location。
  不要把行业背景当成某公司受益的直接证据。
  source 是事件类别，不是发布机构。引用来源时使用 source_provenance 和实际 URL；
  公告 PDF 链接属于提供方附件时，不得自行称其来自证券交易所或监管机构。
  source_provenance 描述取数渠道，不等于已核实的原发布机构。
  此工具不发送私有账户或完整 F01，也不重新运行研究。
parameters:
  type: object
  properties:
    reference:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: "与当前证据查找结果或已读报告 source_reference 一致的本会话任务引用"
    event_id:
      type: string
      pattern: "^[0-9a-f]{16}$"
      description: "stock_public_evidence_find 返回的事件编号"
    cursor:
      type: string
      description: "上一次结果的 next_cursor；不要自行编造"
  required: [reference, event_id]
