use_default_settings: true

general:
  instance_name: "Local AI Agent Search"
  debug: false

search:
  safe_search: 0
  default_lang: "auto"
  formats:
    - html
    - json

server:
  secret_key: "local-ai-agent-searxng-secret-key-change-me"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

engines:
  # 360search — 国内可直连；实测对中文购物/商品查询有效（2026-09-07）
  - name: 360search
    engine: 360search
    shortcut: 360
    weight: 1.5
    disabled: false

  # 夸克 — 国内可直连；实测对中文消费类查询有效（2026-09-07）
  - name: quark
    engine: quark
    shortcut: qk
    weight: 1.5
    disabled: false

  # Bing — 国内可直连，偏国际结果；中文购物查询易被词条劫持，降低排序权重
  - name: bing
    engine: bing
    shortcut: bi
    weight: 0.5
    disabled: false

  # DuckDuckGo — 英文备用（中文查询实测返回 0）
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  # Wikipedia — 知识查询
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  # Google — 需要代理，默认关闭
  - name: google
    engine: google
    shortcut: go
    disabled: true

  # 百度 / 搜狗 — 实测本网络下返回 0（2026-09-07），暂不启用
  - name: baidu
    engine: baidu
    shortcut: bd
    disabled: true

  - name: sogou
    engine: sogou
    shortcut: sg
    disabled: true
