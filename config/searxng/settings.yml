# 2026-09-07：用 keep_only 收敛引擎集。
# use_default_settings 为 true 时自定义 engines 只是按名覆盖、内置引擎集仍然激活
#（实测 98 个在跑，本网络不可达的引擎每次搜索都等超时）；
# 直接写 false 会因缺失默认段导致启动校验失败，故用字典形式的 keep_only。
use_default_settings:
  engines:
    keep_only:
      - 360search
      - quark
      - bing
      - baidu
      - sogou
      - duckduckgo
      - wikipedia
      - google

general:
  instance_name: "Local AI Agent Search"
  debug: false

search:
  safe_search: 0
  default_lang: "auto"
  formats:
    - html
    - json

server:
  secret_key: "local-ai-agent-searxng-secret-key-change-me"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

engines:
  # 360search — 国内可直连；实测对中文购物/商品查询有效（2026-09-07）
  - name: 360search
    engine: 360search
    shortcut: 360
    weight: 1.5
    disabled: false

  # 夸克 — 国内可直连；实测对中文消费类查询有效（2026-09-07）
  - name: quark
    engine: quark
    shortcut: qk
    weight: 1.5
    disabled: false

  # Bing — 国内可直连，偏国际结果；中文购物查询易被词条劫持，降低排序权重
  - name: bing
    engine: bing
    shortcut: bi
    weight: 0.5
    disabled: false

  # 以下实测本网络不可用，仅登记原因备查（2026-09-07）：
  # 百度 — 对机器流量弹验证码墙（SearxEngineCaptchaException，引擎被自动挂起 1 小时）
  - name: baidu
    engine: baidu
    shortcut: bd
    disabled: true

  # 搜狗 — 容器内 DNS 解析 www.sogou.com 失败（Errno -5）
  - name: sogou
    engine: sogou
    shortcut: sg
    disabled: true

  # DuckDuckGo — 连接 html.duckduckgo.com 超时
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: true

  # Wikipedia — zh.wikipedia.org 连接超时
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: true

  # Google — 需要代理
  - name: google
    engine: google
    shortcut: go
    disabled: true
